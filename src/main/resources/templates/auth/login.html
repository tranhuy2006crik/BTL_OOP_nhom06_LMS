<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - LMS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Đăng nhập</h1>
        <p class="muted">Hệ thống quản lý học tập</p>

        <div th:if="${param.error}" class="alert alert-error">Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>
        <div th:if="${param.logout}" class="alert alert-ok">Bạn đã đăng xuất.</div>
        <div th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autofocus>

            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" required>

            <button class="btn" type="submit">Đăng nhập</button>
        </form>
        <p class="muted">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
    </div>
</div>
</body>
</html>
