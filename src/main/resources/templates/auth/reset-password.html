<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu - LMS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Đặt lại mật khẩu</h1>

        <div th:unless="${tokenValid}">
            <div class="alert alert-error">Liên kết không hợp lệ hoặc đã hết hạn.</div>
            <p class="muted"><a th:href="@{/forgot-password}">Yêu cầu liên kết mới</a></p>
        </div>

        <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <input type="hidden" th:field="*{token}">

            <label for="password">Mật khẩu mới</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
            <div class="muted" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            <div class="muted" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <p class="muted">Mật khẩu phải có ít nhất 8 ký tự, gồm cả chữ và số.</p>
            <button class="btn" type="submit">Cập nhật mật khẩu</button>
        </form>
    </div>
</div>
</body>
</html>
