<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - LMS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Quên mật khẩu</h1>
        <p class="muted">Nhập email tài khoản để nhận hướng dẫn đặt lại mật khẩu.</p>

        <div th:if="${successMessage}" class="alert alert-ok" th:text="${successMessage}"></div>
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" required autofocus>
            <div class="muted" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <button class="btn" type="submit">Gửi hướng dẫn</button>
        </form>
        <p class="muted"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
    </div>
</div>
</body>
</html>
