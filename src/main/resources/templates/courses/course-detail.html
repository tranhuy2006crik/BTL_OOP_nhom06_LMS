<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Nội dung khóa học - PTIT Learn</title>

<main class="course-page">
    <section class="course-hero">
        <div>
            <a class="admin-back-link" th:href="@{/courses/{id}(id=${courseId},theme=${theme})}"
               th:text="${course.title}">Back to course</a>
            <p class="eyebrow">COURSE SECTION</p>
            <h1 th:text="${section.title}">Section title</h1>
        </div>
        <div class="course-badge">
            <span>Section</span>
            <strong th:text="${section.position}">1</strong>
        </div>
    </section>
    <div class="alert alert-ok" th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></div>

    <div class="content-grid">
        <aside class="left-panel">
            <div class="panel-block">
                <h3>Thông báo</h3>

                <div th:if="${#lists.isEmpty(announcements)}" class="empty-state">
                    Chưa có thông báo nào.
                </div>

                <article class="announcement-item" th:each="announcement : ${announcements}">
                    <div class="meta-row">
                        <span class="status-tag" th:text="${announcement.status == 'PUBLISHED' ? 'Đã đăng' : announcement.status == 'DRAFT' ? 'Bản nháp' : announcement.status}">Đã đăng</span>
                        <span th:if="${announcement.publishedAt != null}" th:text="${#temporals.format(announcement.publishedAt, 'dd/MM/yyyy HH:mm')}">Thời gian đăng</span>
                    </div>
                    <h4 th:text="${announcement.title}">Tiêu đề thông báo</h4>
                    <p th:text="${announcement.content}">Nội dung thông báo</p>
                </article>
            </div>
        </aside>

        <section class="main-panel">
            <div class="section-head">
                <h2>Nội dung chương</h2>
                <span class="section-id" th:text="|Section ${section.position}|">Section</span>
            </div>

            <form class="admin-form" th:if="${canManage}"
                  th:action="@{/courses/{courseId}/sections/{sectionId}/lessons(courseId=${courseId},sectionId=${sectionId})}"
                  method="post">
                <input type="hidden" name="theme" th:value="${theme}">
                <h3>Add lesson</h3>
                <label>Lesson title<input type="text" name="title" maxlength="200" required></label>
                <label>Description<textarea name="description" rows="2"></textarea></label>
                <label>Lesson content<textarea name="content" rows="5" required></textarea></label>
                <button class="btn" type="submit">Create lesson</button>
            </form>

            <div th:if="${#lists.isEmpty(lessons)}" class="empty-state large">
                Chương này chưa có bài học.
            </div>

            <article class="lesson-card" th:each="lesson : ${lessons}">
                <div class="lesson-topbar">
                    <span class="status-tag" th:text="${lesson.status == 'VISIBLE' ? 'Đang hiển thị' : lesson.status == 'HIDDEN' ? 'Đã ẩn' : lesson.status}">Đang hiển thị</span>
                    <span class="lesson-position" th:text="'Bài học ' + ${lesson.position}">Bài học 1</span>
                </div>

                <h3 th:text="${lesson.title}">Tiêu đề bài học</h3>
                <p class="lesson-description" th:text="${lesson.description}">Mô tả bài học</p>

                <div class="lesson-content" th:text="${lesson.content}"></div>

                <form class="admin-form" th:if="${canManage}"
                      th:action="@{/courses/{courseId}/sections/{sectionId}/lessons/{lessonId}(courseId=${courseId},sectionId=${sectionId},lessonId=${lesson.id})}"
                      method="post">
                    <input type="hidden" name="theme" th:value="${theme}">
                    <details>
                        <summary>Edit lesson</summary>
                        <label>Lesson title<input type="text" name="title" th:value="${lesson.title}" maxlength="200" required></label>
                        <label>Description<textarea name="description" rows="2" th:text="${lesson.description}"></textarea></label>
                        <label>Lesson content<textarea name="content" rows="5" th:text="${lesson.content}" required></textarea></label>
                        <button class="btn" type="submit">Save lesson</button>
                    </details>
                </form>
                <form th:if="${canManage}"
                      th:action="@{/courses/{courseId}/sections/{sectionId}/lessons/{lessonId}/delete(courseId=${courseId},sectionId=${sectionId},lessonId=${lesson.id})}"
                      method="post"
                      onsubmit="return confirm('Hide this lesson from students?');">
                    <input type="hidden" name="theme" th:value="${theme}">
                    <button class="admin-text-danger" type="submit">Hide lesson</button>
                </form>
            </article>
        </section>
    </div>
</main>
</html>
