<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>PTIT Learn - Không gian học tập</title>

<main class="home-entry">
    <section class="home-intro">
        <p class="eyebrow">KHÔNG GIAN HỌC TẬP</p>
        <h1>Chào mừng đến với PTIT Learn</h1>
        <p>Truy cập bài học và thông báo trong khóa học của bạn.</p>
    </section>

    <form id="course-entry" class="course-entry-form" method="get" th:action="@{/courses/open}">
        <label for="courseId">Mã khóa học</label>
        <input id="courseId" name="courseId" type="number" min="1" placeholder="Ví dụ: 1" required>

        <label for="sectionId">Mã chương</label>
        <input id="sectionId" name="sectionId" type="number" min="1" placeholder="Ví dụ: 1" required>

        <button type="submit">Mở nội dung học</button>
    </form>
</main>
</html>
